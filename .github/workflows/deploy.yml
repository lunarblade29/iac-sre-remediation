name: CI/CD & Infrastructure Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Allows manual cloud deployment trigger via GitHub UI

jobs:
  # -----------------------------------------------------------
  # 1. CI Job: Linting, Formatting, and Syntax Validation
  # -----------------------------------------------------------
  lint-and-validate:
    name: Code & IaC Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax Check Python App & Monitor
        run: |
          python -m py_compile app/app.py
          python -m py_compile monitor/remediator.py

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Format Check
        run: |
          cd terraform
          terraform fmt -check

      - name: Terraform Validate
        run: |
          cd terraform
          terraform init -backend=false
          terraform validate

      - name: Build Local Test Container (Verify Dockerfile)
        run: |
          docker build -t test-image ./app

  # -----------------------------------------------------------
  # 2. CD Job: Build Image & Deploy via Terraform (Cloud Target)
  # Triggered manually via Actions tab
  # -----------------------------------------------------------
  build-and-deploy:
    name: Build, Provision & Deploy
    needs: lint-and-validate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GAR_LOCATION: europe-west1
      REPOSITORY: sre-apps
      IMAGE_NAME: resilient-flask-app

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCP
        run: |
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      - name: Build & Push Docker Image
        run: |
          IMAGE_TAG="\({{ env.GAR_LOCATION }}-docker.pkg.dev/\){{ env.PROJECT_ID }}/\({{ env.REPOSITORY }}/\){{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker build -t "$IMAGE_TAG" ./app
          docker push "$IMAGE_TAG"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Plan & Apply
        run: |
          cd terraform
          terraform init
          terraform apply -auto-approve -var="project_id=\({{ env.PROJECT_ID }}" -var="image_url=\){{ env.GAR_LOCATION }}-docker.pkg.dev/\({{ env.PROJECT_ID }}/\){{ env.REPOSITORY }}/\({{ env.IMAGE_NAME }}:\){{ github.sha }}"